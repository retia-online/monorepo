name: UI Package CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/ui-sdk/**'
      - '.github/workflows/ui-package.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/ui-sdk/**'
      - '.github/workflows/ui-package.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci
        cd packages/ui-sdk && npm ci
        
    - name: Run tests
      run: |
        cd packages/ui-sdk
        npm run test
        
    - name: Run type checking
      run: |
        cd packages/ui-sdk
        npm run type-check
        
    - name: Build Storybook
      run: |
        cd packages/ui-sdk
        npm run build-storybook
        
    - name: Build package
      run: |
        cd packages/ui-sdk
        npm run build
        
    - name: Visual regression testing
      run: |
        cd packages/ui-sdk
        # Install Playwright for visual testing
        npx playwright install --with-deps chromium
        # Run visual regression tests if they exist
        if [ -f "playwright.config.js" ]; then
          npm run test:visual || echo "No visual tests configured"
        fi
        
    - name: Upload Storybook build artifacts
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request'
      with:
        name: storybook-build
        path: packages/ui-sdk/storybook-static/
        retention-days: 7

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@megamercado'
        
    - name: Install dependencies
      run: |
        npm ci
        cd packages/ui-sdk && npm ci
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Determine version bump
      id: version
      run: |
        cd packages/ui-sdk
        
        # Get the last commit message
        COMMIT_MSG=$(git log -1 --pretty=%B)
        
        # Determine version bump based on conventional commits
        if echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE\|^feat!:\|^fix!:\|^refactor!:"; then
          echo "bump=major" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "^feat:"; then
          echo "bump=minor" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "^fix:\|^perf:\|^refactor:\|^style:\|^test:"; then
          echo "bump=patch" >> $GITHUB_OUTPUT
        else
          echo "bump=patch" >> $GITHUB_OUTPUT
        fi
        
    - name: Bump version
      run: |
        cd packages/ui-sdk
        npm version ${{ steps.version.outputs.bump }} --no-git-tag-version
        
    - name: Build package
      run: |
        cd packages/ui-sdk
        npm run build
        
    - name: Build Storybook for deployment
      run: |
        cd packages/ui-sdk
        npm run build-storybook
        
    - name: Publish to GitHub Packages
      run: |
        cd packages/ui-sdk
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Deploy Storybook to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: packages/ui-sdk/storybook-static
        destination_dir: storybook
        
    - name: Create Git tag
      run: |
        cd packages/ui-sdk
        VERSION=$(node -p "require('./package.json').version")
        git add package.json
        git commit -m "chore(ui): release v$VERSION"
        git tag "ui-v$VERSION"
        git push origin main --tags
        
    - name: Generate release notes
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read package.json to get version
          const packageJson = JSON.parse(fs.readFileSync('packages/ui-sdk/package.json', 'utf8'));
          const version = packageJson.version;
          
          // Get commits since last release
          const { data: commits } = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'packages/ui-sdk',
            per_page: 10
          });
          
          // Generate release notes
          let releaseNotes = `# @megamercado/ui v${version}\n\n`;
          releaseNotes += `## Changes\n\n`;
          
          commits.forEach(commit => {
            const message = commit.commit.message.split('\n')[0];
            if (message.includes('ui')) {
              releaseNotes += `- ${message} (${commit.sha.substring(0, 7)})\n`;
            }
          });
          
          releaseNotes += `\n## Component Library\n\n`;
          releaseNotes += `- 📚 [Storybook Documentation](https://your-org.github.io/your-repo/storybook/)\n`;
          releaseNotes += `- 🎨 Visual regression tests passed\n`;
          releaseNotes += `- ✅ All components tested and built successfully\n`;
          
          // Create release
          await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: `ui-v${version}`,
            name: `@megamercado/ui v${version}`,
            body: releaseNotes,
            draft: false,
            prerelease: false
          });