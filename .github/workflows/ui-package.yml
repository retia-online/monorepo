name: UI Package CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/ui/**'
      - 'packages/ui-sdk/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'packages/ui-sdk/**'
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  PACKAGE_PATH: 'packages/ui-sdk'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test UI Package
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install package dependencies
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm ci
          
      - name: Run linting
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run lint || echo "Linting not configured"
          
      - name: Run type checking
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npx tsc --noEmit
          
      - name: Run tests
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm test
          
      - name: Build package
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build
          
      - name: Build Storybook
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build-storybook || echo "Storybook build not configured"
          
      - name: Upload Storybook build artifacts
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: storybook-build
          path: ${{ env.PACKAGE_PATH }}/storybook-static/
          retention-days: 7

  visual-regression:
    runs-on: ubuntu-latest
    needs: test
    name: Visual Regression Testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install package dependencies
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm ci
          
      - name: Install Playwright
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npx playwright install --with-deps chromium
          
      - name: Build Storybook
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build-storybook || echo "Storybook build not configured"
          
      - name: Run visual regression tests
        run: |
          cd ${{ env.PACKAGE_PATH }}
          # Start Storybook server in background
          npx http-server storybook-static -p 6006 &
          sleep 10
          # Run visual tests (placeholder - would need actual test setup)
          echo "Visual regression tests would run here"
          # npx playwright test --config=playwright-visual.config.js
        continue-on-error: true
        
      - name: Upload visual test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: visual-test-results
          path: ${{ env.PACKAGE_PATH }}/test-results/
          retention-days: 7

  semantic-version:
    runs-on: ubuntu-latest
    needs: [test, visual-regression]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
      new-release-notes: ${{ steps.semantic.outputs.new-release-notes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github
          
      - name: Create semantic-release config
        run: |
          cd ${{ env.PACKAGE_PATH }}
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/changelog",
              [
                "@semantic-release/npm",
                {
                  "npmPublish": false
                }
              ],
              [
                "@semantic-release/git",
                {
                  "assets": ["package.json", "CHANGELOG.md"],
                  "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                }
              ],
              "@semantic-release/github"
            ]
          }
          EOF
          
      - name: Run semantic release
        id: semantic
        run: |
          cd ${{ env.PACKAGE_PATH }}
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [test, visual-regression, semantic-version]
    if: needs.semantic-version.outputs.new-release-published == 'true'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@megamercado'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install package dependencies
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm ci
          
      - name: Build package
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build
          
      - name: Build Storybook for deployment
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build-storybook || echo "Storybook build not configured"
          
      - name: Update package version
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm version ${{ needs.semantic-version.outputs.new-release-version }} --no-git-tag-version
          
      - name: Publish to GitHub Packages
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Deploy Storybook to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PACKAGE_PATH }}/storybook-static
          destination_dir: storybook/ui
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ui-v${{ needs.semantic-version.outputs.new-release-version }}
          release_name: UI Package v${{ needs.semantic-version.outputs.new-release-version }}
          body: |
            ${{ needs.semantic-version.outputs.new-release-notes }}
            
            ## Storybook
            View the component library: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/storybook/ui/
          draft: false
          prerelease: false