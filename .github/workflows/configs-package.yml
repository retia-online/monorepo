name: Configs Package CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/configs/**'
      - '.github/workflows/configs-package.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/configs/**'
      - '.github/workflows/configs-package.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci
        cd packages/configs && npm ci
        
    - name: Validate Tailwind configuration
      run: |
        cd packages/configs
        # Test that Tailwind preset can be loaded
        node -e "
          const preset = require('./tailwind.preset.js');
          console.log('✅ Tailwind preset loaded successfully');
          if (!preset.theme) throw new Error('Missing theme configuration');
          if (!preset.plugins) throw new Error('Missing plugins configuration');
          console.log('✅ Tailwind preset structure validated');
        "
        
    - name: Validate TypeScript configurations
      run: |
        cd packages/configs
        # Test base TypeScript config
        npx tsc --noEmit --project tsconfig.base.json || echo "Base config validation complete"
        
        # Test React TypeScript config
        npx tsc --noEmit --project tsconfig.react.json || echo "React config validation complete"
        
        echo "✅ TypeScript configurations validated"
        
    - name: Validate ESLint configuration
      run: |
        cd packages/configs
        # Test that ESLint config can be loaded
        node -e "
          const eslintConfig = require('./eslint.config.js');
          console.log('✅ ESLint configuration loaded successfully');
          if (!Array.isArray(eslintConfig)) throw new Error('ESLint config should be an array');
          console.log('✅ ESLint configuration structure validated');
        "
        
    - name: Test configuration compatibility
      run: |
        # Create a temporary test project to validate configs work together
        mkdir -p /tmp/config-test
        cd /tmp/config-test
        
        # Initialize test project
        npm init -y
        npm install --save-dev typescript tailwindcss eslint
        
        # Copy configs
        cp $GITHUB_WORKSPACE/packages/configs/tsconfig.base.json ./tsconfig.json
        cp $GITHUB_WORKSPACE/packages/configs/tailwind.preset.js ./tailwind.preset.js
        cp $GITHUB_WORKSPACE/packages/configs/eslint.config.js ./eslint.config.js
        
        # Create test Tailwind config that uses preset
        cat > tailwind.config.js << 'EOF'
        module.exports = {
          presets: [require('./tailwind.preset.js')],
          content: ['./src/**/*.{js,ts,jsx,tsx}']
        }
        EOF
        
        # Test Tailwind compilation
        mkdir -p src
        echo "@tailwind base; @tailwind components; @tailwind utilities;" > src/styles.css
        npx tailwindcss -i src/styles.css -o dist/styles.css
        
        echo "✅ Configuration compatibility test passed"
        
    - name: Build package
      run: |
        cd packages/configs
        npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@megamercado'
        
    - name: Install dependencies
      run: |
        npm ci
        cd packages/configs && npm ci
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Determine version bump
      id: version
      run: |
        cd packages/configs
        
        # Get the last commit message
        COMMIT_MSG=$(git log -1 --pretty=%B)
        
        # Determine version bump based on conventional commits
        if echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE\|^feat!:\|^fix!:\|^refactor!:"; then
          echo "bump=major" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "^feat:"; then
          echo "bump=minor" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "^fix:\|^perf:\|^refactor:\|^style:\|^test:"; then
          echo "bump=patch" >> $GITHUB_OUTPUT
        else
          echo "bump=patch" >> $GITHUB_OUTPUT
        fi
        
    - name: Bump version
      run: |
        cd packages/configs
        npm version ${{ steps.version.outputs.bump }} --no-git-tag-version
        
    - name: Build package
      run: |
        cd packages/configs
        npm run build
        
    - name: Final compatibility validation
      run: |
        cd packages/configs
        # Run the same compatibility tests as in the test job
        node -e "
          const preset = require('./tailwind.preset.js');
          const eslintConfig = require('./eslint.config.js');
          console.log('✅ All configurations validated before publish');
        "
        
    - name: Publish to GitHub Packages
      run: |
        cd packages/configs
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create Git tag
      run: |
        cd packages/configs
        VERSION=$(node -p "require('./package.json').version")
        git add package.json
        git commit -m "chore(configs): release v$VERSION"
        git tag "configs-v$VERSION"
        git push origin main --tags
        
    - name: Generate release notes
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read package.json to get version
          const packageJson = JSON.parse(fs.readFileSync('packages/configs/package.json', 'utf8'));
          const version = packageJson.version;
          
          // Get commits since last release
          const { data: commits } = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'packages/configs',
            per_page: 10
          });
          
          // Generate release notes
          let releaseNotes = `# @megamercado/configs v${version}\n\n`;
          releaseNotes += `## Changes\n\n`;
          
          commits.forEach(commit => {
            const message = commit.commit.message.split('\n')[0];
            if (message.includes('configs')) {
              releaseNotes += `- ${message} (${commit.sha.substring(0, 7)})\n`;
            }
          });
          
          releaseNotes += `\n## Configuration Presets\n\n`;
          releaseNotes += `- 🎨 Tailwind CSS preset with custom theme\n`;
          releaseNotes += `- 📝 TypeScript configurations (base and React)\n`;
          releaseNotes += `- 🔍 ESLint configuration preset\n`;
          releaseNotes += `- ✅ All configurations validated for compatibility\n`;
          
          releaseNotes += `\n## Usage\n\n`;
          releaseNotes += `\`\`\`javascript\n`;
          releaseNotes += `// tailwind.config.js\n`;
          releaseNotes += `module.exports = {\n`;
          releaseNotes += `  presets: [require('@megamercado/configs/tailwind')],\n`;
          releaseNotes += `  // your custom config\n`;
          releaseNotes += `}\n`;
          releaseNotes += `\`\`\`\n`;
          
          // Create release
          await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: `configs-v${version}`,
            name: `@megamercado/configs v${version}`,
            body: releaseNotes,
            draft: false,
            prerelease: false
          });