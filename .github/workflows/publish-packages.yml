name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [auth, api, ui, configs]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@megamercado-vzla'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Build and Publish
        run: |
          cd packages/${{ matrix.package }}
          # Check if version exists before publishing (optional but recommended)
          # For now, just attempt to build and publish
          yarn build
          npm publish || echo "Package already published or failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
