name: API Package CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/api/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/api/**'
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  PACKAGE_PATH: 'packages/api'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test API Package
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install package dependencies
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm ci
          
      - name: Run linting
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run lint || echo "Linting not configured"
          
      - name: Run type checking
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npx tsc --noEmit
          
      - name: Run tests with database
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm test
        env:
          DATABASE_URL: mongodb://testuser:testpass@localhost:27017/test?authSource=admin
          NODE_ENV: test
          
      - name: Build package
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build
          
      - name: Run security audit
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm audit --audit-level moderate
          
      - name: Dependency vulnerability scan
        uses: actions/dependency-review-action@v3
        if: github.event_name == 'pull_request'

  semantic-version:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
      new-release-notes: ${{ steps.semantic.outputs.new-release-notes }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install semantic-release
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github
          
      - name: Create semantic-release config
        run: |
          cd ${{ env.PACKAGE_PATH }}
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/changelog",
              [
                "@semantic-release/npm",
                {
                  "npmPublish": false
                }
              ],
              [
                "@semantic-release/git",
                {
                  "assets": ["package.json", "CHANGELOG.md"],
                  "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                }
              ],
              "@semantic-release/github"
            ]
          }
          EOF
          
      - name: Run semantic release
        id: semantic
        run: |
          cd ${{ env.PACKAGE_PATH }}
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    name: Security Scanning
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm ci
          
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=${{ env.PACKAGE_PATH }}/package.json
          
      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif

  publish:
    runs-on: ubuntu-latest
    needs: [test, semantic-version, security-scan]
    if: needs.semantic-version.outputs.new-release-published == 'true'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@megamercado'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install package dependencies
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm ci
          
      - name: Build package
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm run build
          
      - name: Update package version
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm version ${{ needs.semantic-version.outputs.new-release-version }} --no-git-tag-version
          
      - name: Publish to GitHub Packages
        run: |
          cd ${{ env.PACKAGE_PATH }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: api-v${{ needs.semantic-version.outputs.new-release-version }}
          release_name: API Package v${{ needs.semantic-version.outputs.new-release-version }}
          body: ${{ needs.semantic-version.outputs.new-release-notes }}
          draft: false
          prerelease: false