name: API Package CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/api/**'
      - '.github/workflows/api-package.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/api/**'
      - '.github/workflows/api-package.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci
        cd packages/api && npm ci
        
    - name: Wait for MongoDB
      run: |
        until mongosh --eval "print('MongoDB is ready')" > /dev/null 2>&1; do
          echo "Waiting for MongoDB..."
          sleep 2
        done
        
    - name: Run tests
      run: |
        cd packages/api
        npm run test
      env:
        DATABASE_URL: mongodb://localhost:27017/test_db
        NODE_ENV: test
        
    - name: Run type checking
      run: |
        cd packages/api
        npm run type-check
        
    - name: Build package
      run: |
        cd packages/api
        npm run build
        
    - name: Security audit
      run: |
        cd packages/api
        npm audit --audit-level moderate
        
    - name: Dependency vulnerability scan
      uses: actions/dependency-review-action@v4
      if: github.event_name == 'pull_request'

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@megamercado'
        
    - name: Install dependencies
      run: |
        npm ci
        cd packages/api && npm ci
        
    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: Determine version bump
      id: version
      run: |
        cd packages/api
        
        # Get the last commit message
        COMMIT_MSG=$(git log -1 --pretty=%B)
        
        # Determine version bump based on conventional commits
        if echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE\|^feat!:\|^fix!:\|^refactor!:"; then
          echo "bump=major" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "^feat:"; then
          echo "bump=minor" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -q "^fix:\|^perf:\|^refactor:\|^style:\|^test:"; then
          echo "bump=patch" >> $GITHUB_OUTPUT
        else
          echo "bump=patch" >> $GITHUB_OUTPUT
        fi
        
    - name: Bump version
      run: |
        cd packages/api
        npm version ${{ steps.version.outputs.bump }} --no-git-tag-version
        
    - name: Build package
      run: |
        cd packages/api
        npm run build
        
    - name: Security scan before publish
      run: |
        cd packages/api
        npm audit --audit-level high
        
    - name: Publish to GitHub Packages
      run: |
        cd packages/api
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create Git tag
      run: |
        cd packages/api
        VERSION=$(node -p "require('./package.json').version")
        git add package.json
        git commit -m "chore(api): release v$VERSION"
        git tag "api-v$VERSION"
        git push origin main --tags
        
    - name: Generate release notes
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read package.json to get version
          const packageJson = JSON.parse(fs.readFileSync('packages/api/package.json', 'utf8'));
          const version = packageJson.version;
          
          // Get commits since last release
          const { data: commits } = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'packages/api',
            per_page: 10
          });
          
          // Generate release notes
          let releaseNotes = `# @megamercado/api v${version}\n\n`;
          releaseNotes += `## Changes\n\n`;
          
          commits.forEach(commit => {
            const message = commit.commit.message.split('\n')[0];
            if (message.includes('api')) {
              releaseNotes += `- ${message} (${commit.sha.substring(0, 7)})\n`;
            }
          });
          
          releaseNotes += `\n## Security\n\n`;
          releaseNotes += `- All dependencies scanned for vulnerabilities\n`;
          releaseNotes += `- Database operations tested in CI environment\n`;
          
          // Create release
          await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: `api-v${version}`,
            name: `@megamercado/api v${version}`,
            body: releaseNotes,
            draft: false,
            prerelease: false
          });